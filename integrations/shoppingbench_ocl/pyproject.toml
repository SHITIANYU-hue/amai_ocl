[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimai-shoppingbench-ocl-adapter"
version = "0.1.0"
description = "AiMai OCL adapter and compatibility probe for ShoppingBench"
requires-python = ">=3.10"
dependencies = ["aocl-core>=0.1.0"]

[project.scripts]
aimai-shoppingbench-product-probe = "shoppingbench_ocl.product_probe:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["shoppingbench_ocl*"]

