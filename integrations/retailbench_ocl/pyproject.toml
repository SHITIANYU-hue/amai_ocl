[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailbench-ocl"
version = "0.1.0"
description = "RetailBench host adapter for the environment-independent OCL core"
requires-python = ">=3.10"
dependencies = ["aocl-core>=0.1.0"]

[project.scripts]
retailbench-ocl-smoke = "retailbench_ocl.smoke:main"
retailbench-ocl-v2 = "retailbench_ocl.run_v2:main"
retailbench-ocl-bank = "retailbench_ocl.bank_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
